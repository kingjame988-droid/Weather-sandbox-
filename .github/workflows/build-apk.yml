
name: Build Weather Sandbox APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project
        run: unzip -q WeatherSandbox-Android-Project.zip -d project

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> project/gradle.properties
        
      - name: Build APK
        run: cd project && gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherSandbox-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
